# Test-Gateway: bildet die Pfade des Supabase-API-Gateways (Kong) nach.
resolver 127.0.0.11 valid=5s;

server {
  listen 80;
  client_max_body_size 50m;

  # CORS für die Web-Version der App
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Headers * always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers * always;

  # Die Dienste setzen teils eigene CORS-Header; hier gilt nur der obige Satz.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Expose-Headers;

  location / {
    return 404;
  }

  location /auth/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    set $up http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
  }

  location /rest/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    set $up http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $up;
  }

  location /storage/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    set $up http://storage:5000;
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
  }
}
